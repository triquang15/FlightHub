# =============================================================================
# FlightHub Microservices - Docker Compose DEV
# =============================================================================
# Local development infrastructure only. Spring services normally run via Maven.
# Use docker-compose.prod.yml for Docker Hub service images.
# =============================================================================

x-common-env: &common-env
  SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
  JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:+UseG1GC

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: 12345678

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 10s

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - triquang15

x-db-defaults: &db-defaults
  image: postgres:16-alpine
  restart: unless-stopped
  mem_limit: 512m
  mem_reservation: 256m
  cpus: 0.5
  healthcheck: *postgres-healthcheck
  networks:
    - triquang15

services:
  # ===========================================================================
  # DATABASES
  # ===========================================================================

  userdb:
    <<: *db-defaults
    container_name: userdb
    ports:
      - "127.0.0.1:${USERDB_HOST_PORT:-15432}:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_user

  airlinecoredb:
    <<: *db-defaults
    container_name: airlinecoredb
    ports:
      - "127.0.0.1:${AIRLINECOREDB_HOST_PORT:-5433}:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_core_db

  flightopsdb:
    <<: *db-defaults
    container_name: flightopsdb
    ports:
      - "127.0.0.1:${FLIGHTOPSDB_HOST_PORT:-5434}:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_flight_db

  locationdb:
    <<: *db-defaults
    container_name: locationdb
    ports:
      - "127.0.0.1:${LOCATIONDB_HOST_PORT:-5435}:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_location_db

  seatdb:
    <<: *db-defaults
    container_name: seatdb
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_seat_db

  pricingdb:
    <<: *db-defaults
    container_name: pricingdb
    ports:
      - "127.0.0.1:5437:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_pricing_db

  ancillarydb:
    <<: *db-defaults
    container_name: ancillarydb
    ports:
      - "127.0.0.1:5438:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_ancillary_db

  bookingdb:
    <<: *db-defaults
    container_name: bookingdb
    ports:
      - "127.0.0.1:5439:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_booking_db

  paymentdb:
    <<: *db-defaults
    container_name: paymentdb
    ports:
      - "127.0.0.1:5440:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_payment_db

  mediadb:
    <<: *db-defaults
    container_name: mediadb
    ports:
      - "127.0.0.1:5441:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: media_service_db

  notificationdb:
    <<: *db-defaults
    container_name: notificationdb
    ports:
      - "127.0.0.1:5442:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_notification_db

  # ===========================================================================
  # SHARED INFRASTRUCTURE
  # ===========================================================================

  redis:
    image: redis:7.2-alpine
    container_name: gds-redis
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - triquang15

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "${KAFKA_HOST_PORT:-9092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - triquang15

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: gds-kafka-ui
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
    ports:
      - "${KAFKA_UI_HOST_PORT:-8000}:8080"
    networks:
      - triquang15

  # ===========================================================================
  # FRONTEND DEV SERVER (optional)
  # ===========================================================================
  # Run with:
  #   docker compose --profile frontend -f microservices/docker-compose/docker-compose.dev.yml up -d flighthub-web
  # Vite reads flighthub-web/.env.local from the mounted source directory.

  flighthub-web:
    image: node:25-alpine
    profiles: ["frontend"]
    container_name: flighthub-web
    working_dir: /app
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command:
      - sh
      - -lc
      - |
        if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then
          npm ci
        fi
        npm run dev -- --host 0.0.0.0
    volumes:
      - ../../flighthub-web:/app
      - flighthub-web-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    networks:
      - triquang15

  # ===========================================================================
  # OBSERVABILITY STACK (optional)
  # ===========================================================================
  # Run with:
  #   docker compose --profile observability -f microservices/docker-compose/docker-compose.dev.yml up -d
  # Spring services normally run on the host via Maven, so Prometheus scrapes
  # host.docker.internal:<service-port>/actuator/prometheus.

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    profiles: ["observability"]
    container_name: gds-redis-exporter
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - triquang15

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    profiles: ["observability"]
    container_name: gds-kafka-exporter
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
    networks:
      - triquang15

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: ["observability"]
    container_name: gds-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis-exporter
      - kafka-exporter
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks:
      - triquang15

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    container_name: gds-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - elasticsearch
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-flighthub_admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-flighthub_admin_local}
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    networks:
      - triquang15

  loki:
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    container_name: gds-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    networks:
      - triquang15

  promtail:
    image: grafana/promtail:3.3.2
    profiles: ["observability"]
    container_name: gds-promtail
    restart: unless-stopped
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - triquang15

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["observability"]
    container_name: gds-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ../observability/elasticsearch/flighthub-logs-template.json:/usr/share/elasticsearch/config/flighthub-logs-template.json:ro
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - triquang15

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["observability"]
    container_name: gds-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    networks:
      - triquang15

  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: ["observability"]
    container_name: gds-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    networks:
      - triquang15

  # ===========================================================================
  # ONE-SHOT DATA SEEDING
  # ===========================================================================

  seed-production-demo-data:
    image: postgres:16-alpine
    profiles: ["tools"]
    container_name: gds-seed-production-demo-data
    depends_on:
      userdb:
        condition: service_healthy
      locationdb:
        condition: service_healthy
      airlinecoredb:
        condition: service_healthy
      flightopsdb:
        condition: service_healthy
      seatdb:
        condition: service_healthy
      pricingdb:
        condition: service_healthy
      ancillarydb:
        condition: service_healthy
      bookingdb:
        condition: service_healthy
      paymentdb:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      SEED_BASE_DATA: "true"
      SEED_SEAT: "true"
      SEED_FLIGHT_OPS: "true"
      SEED_PRICING: "true"
      SEED_ANCILLARY: "true"
    volumes:
      - ../Documentation/sql:/seed-sql:ro
      - ../scripts/seed-production-demo-data-internal.sh:/seed-scripts/seed-production-demo-data-internal.sh:ro
    command: ["sh", "/seed-scripts/seed-production-demo-data-internal.sh"]
    networks:
      - triquang15

  seed-airline-core-data:
    image: postgres:16-alpine
    profiles: ["tools"]
    container_name: gds-seed-airline-core-data
    depends_on:
      userdb:
        condition: service_healthy
      locationdb:
        condition: service_healthy
      airlinecoredb:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      SEED_BASE_DATA: "false"
      SEED_SEAT: "false"
      SEED_FLIGHT_OPS: "false"
      SEED_PRICING: "false"
      SEED_ANCILLARY: "false"
    volumes:
      - ../Documentation/sql:/seed-sql:ro
      - ../scripts/seed-production-demo-data-internal.sh:/seed-scripts/seed-production-demo-data-internal.sh:ro
    command: ["sh", "/seed-scripts/seed-production-demo-data-internal.sh"]
    networks:
      - triquang15

networks:
  triquang15:
    driver: bridge

volumes:
  flighthub-web-node-modules:
  prometheus-data:
  grafana-data:
  loki-data:
  elasticsearch-data:
  alertmanager-data:
