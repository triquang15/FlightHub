# =============================================================================
# FlightHub Microservices - Docker Compose DEV
# =============================================================================
# Local development infrastructure only. Spring services normally run via Maven.
# Use docker-compose.prod.yml for Docker Hub service images.
# =============================================================================

x-common-env: &common-env
  SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
  JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:+UseG1GC

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: 12345678

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 10s

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - triquang15

x-db-defaults: &db-defaults
  image: postgres:16-alpine
  restart: unless-stopped
  mem_limit: 512m
  mem_reservation: 256m
  cpus: 0.5
  healthcheck: *postgres-healthcheck
  networks:
    - triquang15

services:
  # ===========================================================================
  # DATABASES
  # ===========================================================================

  userdb:
    <<: *db-defaults
    container_name: userdb
    ports:
      - "127.0.0.1:${USERDB_HOST_PORT:-15432}:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_user

  airlinecoredb:
    <<: *db-defaults
    container_name: airlinecoredb
    ports:
      - "127.0.0.1:${AIRLINECOREDB_HOST_PORT:-5433}:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_core_db

  flightopsdb:
    <<: *db-defaults
    container_name: flightopsdb
    ports:
      - "127.0.0.1:${FLIGHTOPSDB_HOST_PORT:-5434}:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_flight_db

  locationdb:
    <<: *db-defaults
    container_name: locationdb
    ports:
      - "127.0.0.1:${LOCATIONDB_HOST_PORT:-5435}:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_location_db

  seatdb:
    <<: *db-defaults
    container_name: seatdb
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_seat_db

  pricingdb:
    <<: *db-defaults
    container_name: pricingdb
    ports:
      - "127.0.0.1:5437:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_pricing_db

  ancillarydb:
    <<: *db-defaults
    container_name: ancillarydb
    ports:
      - "127.0.0.1:5438:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_ancillary_db

  bookingdb:
    <<: *db-defaults
    container_name: bookingdb
    ports:
      - "127.0.0.1:5439:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_booking_db

  paymentdb:
    <<: *db-defaults
    container_name: paymentdb
    ports:
      - "127.0.0.1:5440:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_payment_db

  mediadb:
    <<: *db-defaults
    container_name: mediadb
    ports:
      - "127.0.0.1:5441:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: media_service_db

  notificationdb:
    <<: *db-defaults
    container_name: notificationdb
    ports:
      - "127.0.0.1:5442:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: airline_notification_db

  # ===========================================================================
  # SHARED INFRASTRUCTURE
  # ===========================================================================

  redis:
    image: redis:7.2-alpine
    container_name: gds-redis
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - triquang15

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "${KAFKA_HOST_PORT:-9092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - triquang15

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: gds-kafka-ui
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
    ports:
      - "${KAFKA_UI_HOST_PORT:-8000}:8080"
    networks:
      - triquang15

  # ===========================================================================
  # ONE-SHOT DATA SEEDING
  # ===========================================================================

  seed-production-demo-data:
    image: postgres:16-alpine
    profiles: ["tools"]
    container_name: gds-seed-production-demo-data
    depends_on:
      userdb:
        condition: service_healthy
      locationdb:
        condition: service_healthy
      airlinecoredb:
        condition: service_healthy
      flightopsdb:
        condition: service_healthy
      seatdb:
        condition: service_healthy
      pricingdb:
        condition: service_healthy
      ancillarydb:
        condition: service_healthy
      bookingdb:
        condition: service_healthy
      paymentdb:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      SEED_BASE_DATA: "true"
      SEED_SEAT: "true"
      SEED_FLIGHT_OPS: "true"
      SEED_PRICING: "true"
      SEED_ANCILLARY: "true"
    volumes:
      - ../Documentation/sql:/seed-sql:ro
      - ../scripts/seed-production-demo-data-internal.sh:/seed-scripts/seed-production-demo-data-internal.sh:ro
    command: ["sh", "/seed-scripts/seed-production-demo-data-internal.sh"]
    networks:
      - triquang15

  seed-airline-core-data:
    image: postgres:16-alpine
    profiles: ["tools"]
    container_name: gds-seed-airline-core-data
    depends_on:
      userdb:
        condition: service_healthy
      locationdb:
        condition: service_healthy
      airlinecoredb:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      SEED_BASE_DATA: "false"
      SEED_SEAT: "false"
      SEED_FLIGHT_OPS: "false"
      SEED_PRICING: "false"
      SEED_ANCILLARY: "false"
    volumes:
      - ../Documentation/sql:/seed-sql:ro
      - ../scripts/seed-production-demo-data-internal.sh:/seed-scripts/seed-production-demo-data-internal.sh:ro
    command: ["sh", "/seed-scripts/seed-production-demo-data-internal.sh"]
    networks:
      - triquang15

networks:
  triquang15:
    driver: bridge
