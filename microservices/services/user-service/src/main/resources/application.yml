# =============================================================================
# USER SERVICE — Local Configuration
# =============================================================================

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true

spring:
  application:
    name: user-service

  profiles:
    active: dev

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  servlet:
    multipart:
      max-file-size: ${USER_AVATAR_MAX_FILE_SIZE:5MB}
      max-request-size: ${USER_AVATAR_MAX_REQUEST_SIZE:6MB}

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

  # ================= KAFKA (PRODUCER) =================
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      acks: all
      retries: 3

      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: true   
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        batch.size: 16384

jwt:
  secret: ${JWT_SECRET:bTNRd2VVaXQ5Y2x5SmV4N2N0R3J1Qm5vS0R5Q0l5M3A5aXJYTXVqN3h4N0J5Zw==}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  issuer: ${JWT_ISSUER:FlightHub}

# ================= TOPIC CONFIG =================
kafka:
  topics:
    suspicious-login: security.suspicious-login
    password-reset-requested: user.password-reset-requested
    admin-user-provisioned: ${KAFKA_TOPIC_ADMIN_USER_PROVISIONED:user.admin-provisioned}

# ================= CUSTOM APP CONFIG =================
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  admin:
    password: ${ADMIN_PASSWORD:Admin@123}
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:QW5xY0ZJY2dLNWV1TzZ2aDJlYk1aZzV1d3pHb3V3M2l4YkFTR0NhN2s0Q0E4VQ==}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
  storage:
    avatar:
      local-dir: ${USER_AVATAR_LOCAL_DIR:${java.io.tmpdir}/flighthub/avatars}
  media-service:
    base-url: ${MEDIA_SERVICE_BASE_URL:http://localhost:8089}

# ================= OPENAPI / SWAGGER =================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

# ================= ACTUATOR =================
info:
  app:
    name: ${spring.application.name}
    description: Manages user accounts, profiles, and authentication
    version: 1.0.0
    environment: development

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
