# =============================================================================
# NOTIFICATION SERVICE — Local Configuration
# =============================================================================

server:
  port: 8091

spring:
  application:
    name: notification-service

  config:
    import: optional:configserver:http://localhost:8888

  # ================= KAFKA CONSUMER =================
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        # 🔥 MULTI-EVENT SUPPORT
        spring.json.trusted.packages: "com.triquang.message"
        spring.json.use.type.headers: true   # 🔥 QUAN TRỌNG

        # ❌ KHÔNG dùng default.type (tránh lỗi deserialize sai event)

        # 🔥 STABILITY
        max.poll.interval.ms: 300000
        session.timeout.ms: 15000

    listener:
      ack-mode: record
      concurrency: 3

  # ================= EMAIL (SMTP) =================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_APP_PASSWORD:your_app_password}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: false

  # ================= THYMELEAF =================
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false   # 👉 production: true

# ================= EUREKA =================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# ================= TWILIO =================
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  enabled: ${TWILIO_ENABLED:false}

# ================= NOTIFICATION =================
notification:
  from-email: ${MAIL_FROM:flight_hub@gmail.com}
  from-name: "Flight Hub Notifications"
  support-email: ${MAIL_FROM:flight_hub@gmail.com}
  support-phone: "1800-123-5678"

  frontend-base-url: http://localhost:3000
  checkin-url: ${notification.frontend-base-url}/checkin
  manage-booking-url: ${notification.frontend-base-url}/booking

# ================= LOGGING =================
logging:
  level:
    org.springframework.kafka: INFO
    org.apache.kafka: WARN

# ================= ACTUATOR =================
info:
  app:
    name: ${spring.application.name}
    description: Notification service for security alerts and booking events
    version: 1.0.0
    environment: development

management:
  endpoints:
    web:
      exposure:
        include: health, info

  endpoint:
    health:
      show-details: always
    info:
      enabled: true

  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true