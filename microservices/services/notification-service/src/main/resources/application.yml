# =============================================================================
# NOTIFICATION SERVICE — Local Configuration
# =============================================================================

server:
  port: 8091

spring:
  application:
    name: notification-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

  # ================= REDIS (IDEMPOTENCY) =================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000ms

      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms

  # ================= KAFKA CONSUMER =================
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        # MULTI-EVENT SUPPORT
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.triquang.message"
        spring.json.use.type.headers: true

        # STABILITY
        max.poll.interval.ms: 300000
        session.timeout.ms: 15000

    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        batch.size: 16384

    listener:
      ack-mode: record
      concurrency: 3

  # ================= EMAIL (SMTP) =================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_APP_PASSWORD:your_app_password}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: false

  # ================= THYMELEAF =================
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false   # 👉 production: true

# ================= EUREKA =================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# ================= TWILIO =================
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  enabled: ${TWILIO_ENABLED:false}

# ================= NOTIFICATION =================
notification:
  from-email: ${MAIL_FROM:flight_hub@gmail.com}
  from-name: "Flight Hub Notifications"
  support-email: ${MAIL_FROM:flight_hub@gmail.com}
  support-phone: "1800-123-5678"
  kafka:
    listener:
      auto-startup: ${NOTIFICATION_KAFKA_LISTENER_AUTO_STARTUP:true}
  idempotency:
    retention-seconds: ${NOTIFICATION_IDEMPOTENCY_RETENTION_SECONDS:86400}
    processing-lock-seconds: ${NOTIFICATION_IDEMPOTENCY_LOCK_SECONDS:300}
  password-reset-url: ${PASSWORD_RESET_URL:${notification.frontend-base-url}/reset-password}

  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  checkin-url: ${notification.frontend-base-url}/checkin
  manage-booking-url: ${notification.frontend-base-url}/booking

# ================= TOPIC CONFIG =================
kafka:
  topics:
    booking-confirmed: ${KAFKA_TOPIC_BOOKING_CONFIRMED:booking.confirmed}
    booking-confirmed-dlq: ${KAFKA_TOPIC_BOOKING_CONFIRMED_DLQ:booking.confirmed.DLQ}
    payment-failed-notification: ${KAFKA_TOPIC_PAYMENT_FAILED_NOTIFICATION:payment.failed.notification}
    booking-refunded-notification: ${KAFKA_TOPIC_BOOKING_REFUNDED_NOTIFICATION:booking.refunded.notification}
    ticket-issued: ${KAFKA_TOPIC_TICKET_ISSUED:booking.ticket-issued}
    flight-schedule-changed-notification: ${KAFKA_TOPIC_FLIGHT_SCHEDULE_CHANGED_NOTIFICATION:flight.schedule-changed.notification}
    airline-onboarding-decision: ${KAFKA_TOPIC_AIRLINE_ONBOARDING_DECISION:airline.onboarding-decision}
    admin-user-provisioned: ${KAFKA_TOPIC_ADMIN_USER_PROVISIONED:user.admin-provisioned}
    notification-failure-alert: ${KAFKA_TOPIC_NOTIFICATION_FAILURE_ALERT:notification.failure-alert}
    password-reset-requested: ${KAFKA_TOPIC_PASSWORD_RESET_REQUESTED:user.password-reset-requested}
    password-reset-requested-dlq: ${KAFKA_TOPIC_PASSWORD_RESET_REQUESTED_DLQ:user.password-reset-requested.DLQ}
    suspicious-login: ${KAFKA_TOPIC_SUSPICIOUS_LOGIN:security.suspicious-login}
    suspicious-login-dlq: ${KAFKA_TOPIC_SUSPICIOUS_LOGIN_DLQ:security.suspicious-login.DLQ}
  groups:
    notification-dlq: ${KAFKA_GROUP_NOTIFICATION_DLQ:notification-dlq-group}

# ================= OPENAPI / SWAGGER =================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

# ================= LOGGING =================
logging:
  level:
    org.springframework.kafka: INFO
    org.apache.kafka: WARN

# ================= ACTUATOR =================
info:
  app:
    name: ${spring.application.name}
    description: Notification service for security alerts and booking events
    version: 1.0.0
    environment: development

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

  endpoint:
    health:
      show-details: always
    info:
      enabled: true

  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
