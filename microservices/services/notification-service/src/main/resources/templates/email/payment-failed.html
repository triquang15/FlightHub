<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:28px 12px;">
  <tr><td align="center">
    <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #e2e8f0;">
      <tr><td style="padding:28px 32px;background:#991b1b;color:#ffffff;">
        <p style="margin:0 0 8px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;">Payment issue</p>
        <h1 style="margin:0;font-size:26px;line-height:1.25;">We could not complete your payment</h1>
      </td></tr>
      <tr><td style="padding:28px 32px;">
        <p style="margin:0 0 18px;font-size:16px;line-height:1.6;">Hi <strong th:text="${userName}">Traveller</strong>, your payment for booking <strong th:text="${bookingReference}">BK123</strong> was not completed.</p>
        <table role="presentation" width="100%" style="border:1px solid #e2e8f0;border-radius:12px;">
          <tr><td style="padding:12px 16px;color:#64748b;">Amount</td><td align="right" style="padding:12px 16px;font-weight:800;" th:text="${amountDisplay}">USD 0.00</td></tr>
          <tr><td style="padding:12px 16px;color:#64748b;border-top:1px solid #e2e8f0;">Provider</td><td align="right" style="padding:12px 16px;border-top:1px solid #e2e8f0;" th:text="${paymentGateway}">Stripe</td></tr>
          <tr><td style="padding:12px 16px;color:#64748b;border-top:1px solid #e2e8f0;">Reason</td><td align="right" style="padding:12px 16px;border-top:1px solid #e2e8f0;" th:text="${failureReason}">Payment verification failed</td></tr>
          <tr><td style="padding:12px 16px;color:#64748b;border-top:1px solid #e2e8f0;">Detected at</td><td align="right" style="padding:12px 16px;border-top:1px solid #e2e8f0;" th:text="${failedAt}">N/A</td></tr>
        </table>
        <p style="margin:22px 0 0;"><a th:href="${manageBookingUrl}" style="display:inline-block;background:#f97316;color:#ffffff;text-decoration:none;padding:13px 18px;border-radius:12px;font-weight:800;">Review booking</a></p>
      </td></tr>
      <tr><td style="padding:20px 32px;background:#0f172a;color:#94a3b8;font-size:12px;line-height:1.6;">Need help? Contact <a th:href="${'mailto:' + supportEmail}" th:text="${supportEmail}" style="color:#93c5fd;">support</a>.</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
