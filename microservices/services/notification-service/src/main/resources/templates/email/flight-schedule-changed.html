<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:28px 12px;">
  <tr><td align="center">
    <table role="presentation" width="680" cellpadding="0" cellspacing="0" style="max-width:680px;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #e2e8f0;">
      <tr><td style="padding:28px 32px;background:#7c2d12;color:#ffffff;">
        <p style="margin:0 0 8px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;">Schedule update</p>
        <h1 style="margin:0;font-size:26px;">Your flight schedule changed</h1>
      </td></tr>
      <tr><td style="padding:28px 32px;">
        <p style="margin:0 0 18px;font-size:16px;line-height:1.6;">Hi <strong th:text="${userName}">Traveller</strong>, flight <strong th:text="${flightNumber}">VN123</strong> for booking <strong th:text="${bookingReference}">BK123</strong> has an update.</p>
        <table role="presentation" width="100%" style="border:1px solid #e2e8f0;border-radius:12px;">
          <tr><td style="padding:12px 16px;color:#64748b;">Departure</td><td align="right" style="padding:12px 16px;"><span th:text="${oldDeparture}">Old</span> → <strong th:text="${newDeparture}">New</strong></td></tr>
          <tr><td style="padding:12px 16px;color:#64748b;border-top:1px solid #e2e8f0;">Arrival</td><td align="right" style="padding:12px 16px;border-top:1px solid #e2e8f0;"><span th:text="${oldArrival}">Old</span> → <strong th:text="${newArrival}">New</strong></td></tr>
          <tr><td style="padding:12px 16px;color:#64748b;border-top:1px solid #e2e8f0;">Status</td><td align="right" style="padding:12px 16px;border-top:1px solid #e2e8f0;"><span th:text="${oldStatus}">Old</span> → <strong th:text="${newStatus}">New</strong></td></tr>
          <tr><td style="padding:12px 16px;color:#64748b;border-top:1px solid #e2e8f0;">Gate / terminal</td><td align="right" style="padding:12px 16px;border-top:1px solid #e2e8f0;"><span th:text="${oldGate}">Old gate</span> / <span th:text="${oldTerminal}">Old terminal</span> → <strong th:text="${newGate}">New gate</strong> / <strong th:text="${newTerminal}">New terminal</strong></td></tr>
        </table>
        <p style="margin:22px 0 0;"><a th:href="${manageBookingUrl}" style="display:inline-block;background:#f97316;color:#ffffff;text-decoration:none;padding:13px 18px;border-radius:12px;font-weight:800;">Review booking</a></p>
      </td></tr>
      <tr><td style="padding:20px 32px;background:#0f172a;color:#94a3b8;font-size:12px;line-height:1.6;">Need help? Contact <a th:href="${'mailto:' + supportEmail}" th:text="${supportEmail}" style="color:#93c5fd;">support</a>.</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
