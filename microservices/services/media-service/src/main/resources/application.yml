eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true

server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: media-service
  config:
    import: optional:configserver:http://localhost:8888

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:6MB}

app:
  media:
    storage-path: ${MEDIA_STORAGE_PATH:uploads/media}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:5242880}

info:
  app:
    name: ${spring.application.name}
    description: Stores media metadata and local files with S3-ready storage keys
    version: 1.0.0
    environment: development

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
