spring:
  application:
    name: ancillary-service

  servlet:
    multipart:
      max-file-size: ${ANCILLARY_MEDIA_MAX_FILE_SIZE:${MEAL_IMAGE_MAX_FILE_SIZE:8MB}}
      max-request-size: ${ANCILLARY_MEDIA_MAX_REQUEST_SIZE:${MEAL_IMAGE_MAX_REQUEST_SIZE:9MB}}

  config:
    import: optional:configserver:http://localhost:8888

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3000ms
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.FeignException
    instances:
      AirlineClient:
        base-config: default
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
      LocationClient:
        base-config: default
        wait-duration-in-open-state: 20s
      SeatClient:
        base-config: default

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true

info:
  app:
    name: ${spring.application.name}
    description: Manages ancillary services such as baggage, meals, and seat upgrades
    version: 1.0.0
    environment: development

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  media-service:
    base-url: ${MEDIA_SERVICE_BASE_URL:http://localhost:8089}
  storage:
    ancillary-icon:
      local-dir: ${ANCILLARY_ICON_STORAGE_DIR:${java.io.tmpdir}/flighthub/ancillary-icons}
    meal-image:
      local-dir: ${MEAL_IMAGE_STORAGE_DIR:${java.io.tmpdir}/flighthub/meal-images}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, circuitbreakers, circuitbreakerevents
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
