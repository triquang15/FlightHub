server:
  port: 8080

spring:
  application:
    name: api-gateway

  config:
    import: optional:configserver:http://localhost:8888

  # ================= REDIS =================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000ms

      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms

app:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:QW5xY0ZJY2dLNWV1TzZ2aDJlYk1aZzV1d3pHb3V3M2l4YkFTR0NhN2s0Q0E4VQ==}

jwt:
  secret: ${JWT_SECRET:bTNRd2VVaXQ5Y2x5SmV4N2N0R3J1Qm5vS0R5Q0l5M3A5aXJYTXVqN3h4N0J5Zw==}

# ================= OPENAPI / SWAGGER =================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: User Service
        url: /docs/user-service/v3/api-docs
      - name: Notification Service
        url: /docs/notification-service/v3/api-docs
      - name: Location Service
        url: /docs/location-service/v3/api-docs
      - name: Airline Core Service
        url: /docs/airline-core-service/v3/api-docs

# ================= RESILIENCE4J =================
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true

    instances:
      booking-service-cb:
        timeout-duration: 8s
      payment-service-cb:
        timeout-duration: 10s

  circuitbreaker:
    configs:
      gateway-default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

    instances:
      booking-service-cb:
        base-config: gateway-default
        failure-rate-threshold: 40
        wait-duration-in-open-state: 45s

      payment-service-cb:
        base-config: gateway-default
        failure-rate-threshold: 30
        wait-duration-in-open-state: 60s

      flight-ops-service-cb:
        base-config: gateway-default
      seat-service-cb:
        base-config: gateway-default
      pricing-service-cb:
        base-config: gateway-default
      ancillary-service-cb:
        base-config: gateway-default
      location-service-cb:
        base-config: gateway-default
      airline-core-service-cb:
        base-config: gateway-default
      user-service-cb:
        base-config: gateway-default

# ================= EUREKA =================
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

  client:
    register-with-eureka: true
    fetch-registry: true

# ================= ACTUATOR + TRACING =================
management:
  endpoints:
    web:
      exposure:
        include: health, info, circuitbreakers, circuitbreakerevents, metrics

  endpoint:
    health:
      show-details: always
    info:
      enabled: true

  health:
    circuitbreakers:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# ================= LOGGING =================
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.triquang: DEBUG

  pattern:
    level: "%5p [${spring.application.name},traceId=%X{traceId}]"

# ================= APP INFO =================
info:
  app:
    name: ${spring.application.name}
    description: API Gateway - routes and load balances all incoming requests across microservices
    version: 1.0.0
    environment: development
