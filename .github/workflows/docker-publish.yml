name: Publish Docker Images

run-name: Publish Docker Images from ${{ github.ref_name }} as ${{ inputs.image_tag || 'latest' }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish
        required: true
        default: latest
      push_latest:
        description: Also tag images as latest
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: triquang15

jobs:
  backend-package:
    name: Backend package artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package and install backend modules
        working-directory: microservices
        run: mvn -B -ntp -DskipTests install

      - name: Repackage executable service jars
        working-directory: microservices
        run: |
          set -euo pipefail
          service_modules=(
            platform/service-registry
            platform/config-server
            platform/api-gateway
            services/user-service
            services/airline-core-service
            services/flight-ops-service
            services/location-service
            services/seat-service
            services/pricing-service
            services/ancillary-service
            services/booking-service
            services/payment-service
            services/subscription-service
            services/notification-service
          )

          for module in "${service_modules[@]}"; do
            mvn -B -ntp -pl "$module" -DskipTests package org.springframework.boot:spring-boot-maven-plugin:4.0.5:repackage
          done

      - name: Upload service jars
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          if-no-files-found: error
          retention-days: 1
          path: |
            microservices/platform/*/target/*.jar
            microservices/services/*/target/*.jar

  backend-images:
    name: Backend image - ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: backend-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gds-service-registry
            jar: platform/service-registry/target/service-registry-0.0.1-SNAPSHOT.jar
            service: service-registry
          - image: gds-config-server
            jar: platform/config-server/target/config-server-0.0.1-SNAPSHOT.jar
            service: config-server
          - image: gds-api-gateway
            jar: platform/api-gateway/target/api-gateway-0.0.1-SNAPSHOT.jar
            service: api-gateway
          - image: gds-user
            jar: services/user-service/target/user-service-0.0.1-SNAPSHOT.jar
            service: user-service
          - image: gds-airline
            jar: services/airline-core-service/target/airline-core-service-0.0.1-SNAPSHOT.jar
            service: airline-core-service
          - image: gds-flight-ops
            jar: services/flight-ops-service/target/flight-ops-service-0.0.1-SNAPSHOT.jar
            service: flight-ops-service
          - image: gds-location
            jar: services/location-service/target/location-service-0.0.1-SNAPSHOT.jar
            service: location-service
          - image: gds-seat
            jar: services/seat-service/target/seat-service-0.0.1-SNAPSHOT.jar
            service: seat-service
          - image: gds-pricing
            jar: services/pricing-service/target/pricing-service-0.0.1-SNAPSHOT.jar
            service: pricing-service
          - image: gds-ancillary
            jar: services/ancillary-service/target/ancillary-service-0.0.1-SNAPSHOT.jar
            service: ancillary-service
          - image: gds-booking
            jar: services/booking-service/target/booking-service-0.0.1-SNAPSHOT.jar
            service: booking-service
          - image: gds-payment
            jar: services/payment-service/target/payment-service-0.0.1-SNAPSHOT.jar
            service: payment-service
          - image: gds-subscription
            jar: services/subscription-service/target/subscription-service-0.0.1-SNAPSHOT.jar
            service: subscription-service
          - image: gds-notification
            jar: services/notification-service/target/notification-service-0.0.1-SNAPSHOT.jar
            service: notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: microservices

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: microservices
          file: microservices/Dockerfile.service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JAR_FILE=${{ matrix.jar }}
            SERVICE_NAME=${{ matrix.service }}

  frontend-image:
    name: Frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/flighthub-web
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: flighthub-web
          file: flighthub-web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8080' }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID || '' }}
            VITE_FACEBOOK_APP_ID=${{ vars.VITE_FACEBOOK_APP_ID || '' }}
